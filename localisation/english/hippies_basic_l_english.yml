 EMPIRE_DESIGN_hippies:0 "Land of Peace and Harmony"
 EMPIRE_DESIGN_hippies_desc:0 "The Tortles do not know how their planet came to be. But they know why it was shaped. Their world was left to them an eon ago, as part of an experiment by an ancient elder race, to determine the effects of a violent environment on a nascent species. Previously, it was a highly deadly tempest-world, with violent wildlife, vicious parasites, and unpredictable weather. On a planet that was, very literally, engineered by some sick creator to torment them, they did the unexpected; they survived. They survived through extending a nurturing, compassionate hand to a world that intended to rip them limb from limb.\n\n With gradual effort, they tamed their world and turned it into a paradise. And through this effort, the philosophical question was at last solved; it is possible to give peace a chance.\n\nAs they grew from their huts and into their cities, they reached out to the stars to find like-minded others, out of a deep love for the unknown, to see what new wisdom they could collect from a wild and dangerous galaxy. The first fragmented television and radio broadcasts they received were quite... 'bodacious'."
 START_SCREEN_HIPPIES:0 "'Everything will be okay in the end. If it's not okay, it's not the end.' - John Lennon.\n\nOur creators were cruel. We don't know why they chose us, chose our planet, or chose to conduct their experiment the way that they did. But they felt entitled to do with us and our world as they pleased. 'To see what would happen,' they told us, 'If the weak and the cowardly are pitted against the unbeatable.'\n\nThey enveloped entire villages in force fields, releasing deadly xenomorphs into them, to see which ones would die first, and how quickly. They poisoned freshwater sources to see how quickly we would turn on each other. They generated earthquakes and natural disasters that battered the survivors and scorched our land until our crops fried.\n\nAnd then, something happened. We can only guess that we weren't their only victims, and another planet - more advanced, or more able - revolted and overthrew them. But they eventually ceased contact, leaving behind only fragments and broken machines. As we picked through the wreckage of our oppressors' engines, we came upon a subspace receiver. It was an observation post, on our tallest mountain, listening in on the television and radio transmissions of a distant planet.\n\nWhat we found in that mountain changed our culture forever. We were heartened, delighted even, to encounter solid proof that there was more life in the universe. And that, above all, there were those who valued their ideals to such a degree that they took an oath to remove themselves from their violent societies entirely. These heroes' words and deeds resonated with us so deeply that we have since vowed to emulate them, and rebuild our world in the image of the utopia they described.\n\nAnd now, as we look to the stars, we hope to find the ones who inspired us to rise above those who sought to grind us down."

 ### Many thanks to Cybrxkhan for providing the namelist that gave me such a hilariously awful idea. If you're reading this, try out their AI Personality mod. It's a lot more diverse than mine!
