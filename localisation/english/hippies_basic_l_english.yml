# Government Forms and Ruler Titles
 gov_naturalist_commune: "Naturalist Commune"
 gov_naturalist_commune_desc: "A society entirely and completely devoted to its peaceful coexistence with nature. A Naturalist Commune centers their entire government around minimizing their economic needs for the sake of preserving their planets' pristine quality."
 RT_GARDENER: "Custodian-Gardener"

 gov_altruistic_utopia: "Altruistic Utopia"
 gov_altruistic_utopia_desc: "Prizing peace, freedom, and harmony above all, an Altruistic Utopia's entire culture is built around principles of nonviolence and constructive dialogue. They carefully build their societies around the ideal that no one should want for anything."
 RT_ELECTED_VOCALIST: "Elected Vocalist"

 gov_monastic_collective: "Monastic Collective"
 gov_monastic_collective_desc: "This monk-like culture has withdrawn from worldly cares and devotes nearly all its time to meditation and inner perfection. Their inner peace is nearly unbreakable, and as a result, their collective harmony is assured."
 RT_ELDER: "Wise Elder"

 gov_star_travelers: "Star Travelers"
 gov_star_travelers_desc: "Springing from a culture that breathlessly catalogued the stars and charted their distances long before they ever left their homeworld, Star Travelers are utterly enthralled with the universe around them. Their economic and government schemes typically revolve around exploring every nook and cranny of every moon they find."
 RT_STARGAZER: "Stargazer-in-Chief"

