 personality_peaceful_counterculture:0 "Peaceful Counterculture"
 personality_peaceful_counterculture_desc:0 "A Peaceful Counterculture seeks nothing more than sedentary harmony with their natural environment. They believe in resolving conflict through non-violent means wherever possible, and tend to eschew material comforts such as money or property. While peaceful, they harbor an eternal grudge against The Man, who seeks to 'keep them down'."

