l_english:
### Peaceful Counterculture ###
# Greetings
## You're harshing the vibe, man
 PC_HOSTILE_GREETING_01:0 "[Root.GetSpeciesAdj] [Root.GetSpeciesNamePluralInsult]? Yeah, well, you know, that's just, like, your opinion, man. At least I'm housebroken."
 PC_HOSTILE_GREETING_02:0 "Come closer. Got a secret for you. Yeah, put your [From.GetSpeciesEarName] close to my [Root.GetSpeciesMouthName]. C'mere. Closer. YOU! HAVE! THE MOST! RANCID! VIBES!"
 PC_HOSTILE_GREETING_03:0 "You know, when I'm grumpy, it's usually because I got the munchies. You should go home, do some yoga, have a bite to eat, take a nap, and leave us alone."
 PC_HOSTILE_GREETING_04:0 "For dudes who are supposed to be in tune with the higher energies of the universe, your aura sure is dark. I don't think your priests have their chakras aligned right."
 PC_HOSTILE_GREETING_05:0 "Bad cop! Bad! No donut for you! Now go sit in the corner and think about what you've done!"
 PC_HOSTILE_GREETING_06:0 "[From.GetSpeciesNameInsultCap] of war and [From.GetSpeciesName] of hate... What are you expecting to achieve? Currency in flesh and bone? Hell opened up and put on sale? Your species has a dark side, and dealing in death is the nature of the beast." # kudos to Pink Floyd and Dogs Of War
 PC_HOSTILE_GREETING_07:0 "As long as there are people who think capitalism is a solution to any of society's problems, we'll be stuck in an endless cycle of oppression and bad vibes. Our only shot at Nirvana is to throw off people like you forever!"
 PC_HOSTILE_GREETING_08:0 "Dudes... what did you do to your poor homeworld? Look at her! She's dead! You buried her alive under a mile of concrete and drowned her to death in toxic waste! You monsters!"
 PC_HOSTILE_GREETING_09:0 "I was meditating with my crystals this morning, and one of them cracked. I thought it was a sign that today was gonna be a bad day. And now you've shown up. Bummer."
 PC_HOSTILE_GREETING_10:0 "I got a class of [Root.GetSpeciesSpawnNamePlural] to teach, and they're super stoked about traveling the galaxy one day. I'm gonna tell them that [From.GetAdj] envoys eat kids if you don't leave now."
 PC_HOSTILE_GREETING_11:0 "You make practicing universal love really, really hard, dude."
 PC_HOSTILE_GREETING_12:0 "[From.GetAdj] envoys are officially banned from the community center. You know how hard it is to get banned? Smelly Mike is still allowed, and he ACTUALLY doesn't bathe."
 PC_MECH_HOSTILE_GREETING_01:0 "You know, dude, we wanted to believe in you. We wanted to believe that evil is something you learn, not something you're born with. So, lemme ask you; which is it? Were you built evil? Are you a gun? Or did you learn from the worst we have to offer?"
 PC_MECH_HOSTILE_GREETING_02:0 "You know what's really sad, dude? We don't hate robots. Really. We believe that every thing that can think for itself is alive, and that includes you. You could be better than this, you just gotta believe in yourself..."
 PC_MECH_HOSTILE_GREETING_03:0 "You'd think that something as smart as you would know that war isn't the answer. Maybe you did your big fancy math wrong."
 PC_MECH_HOSTILE_GREETING_04:0 "When a [From.GetSpeciesName]'s an empty kettle, he should be on his mettle. But are you torn apart? Just because it'd be a blessing, if maybe we could be besties... if you only had a heart."
 PC_HOSTILE_GREETING_HUMAN_01:0 "Mohandas Gandhi, Greta Thunberg, Nelson Mandela, Israel Kamakawiwo'ole... if [From.GetRulerName] wanted to be in the history book next to them, then you super missed your chance, bud."
## 'Sup, dudes!
 PC_NEUTRAL_GREETING_01:0 "'Sup, my dudes! We come in peace!"
 PC_NEUTRAL_GREETING_02:0 "Our [Root.GetRulerTitle] wants to ask; are you cool with recreational intoxicants? If not, that's chill, consent is king. We respect a straight-edge."
 PC_NEUTRAL_GREETING_03:0 "Have you ever hugged a tree? Like, really hugged a tree? You should try it! Just walk out, hug any tree on [From.Capital.GetName], and just connect with nature."
 PC_NEUTRAL_GREETING_04:0 "The [Root.GetRulerTitle] abides!"
 PC_NEUTRAL_GREETING_05:0 "Hey, cousin-[From.GetSpeciesNamePlural]! How's it hangin'?"
 PC_NEUTRAL_GREETING_06:0 "We're all about raising our vibrations and being in tune with the universe. We wanna spread love and harmony to the galaxy."
 PC_NEUTRAL_GREETING_07:0 "We're super proud of teaching our [Root.GetSpeciesSpawnNamePlural] to understand and love the universe. Hate is a learned thing, you know?"
 PC_NEUTRAL_GREETING_08:0 "Dude... how wild is it that we get to talk to aliens? Every day! I think that's the trippiest thing ever."
 PC_NEUTRAL_GREETING_09:0 "We got exactly one rule in the [Root.GetName], and it's 'embody the spirit of love'. Ideas like 'private property' are just how the Man keeps us down."
 PC_MECH_NEUTRAL_GREETING_01:0 "So... I'm guessing offering you food's out of the question... Do you wanna join the drum circle instead?"
 PC_MECH_NEUTRAL_GREETING_02:0 "Wait. There are dudes who think that you aren't people? And they're using their religion as an excuse for it? That's totally bogus!"
 PC_MECH_NEUTRAL_GREETING_03:0 "So, like... did turning into a robo-dude hurt? How do you feel? Like, about the universe in general."
## Let the good times--and joints--roll!
 PC_FRIENDLY_GREETING_01:0 "Hey, it's [From.GetRulerName]! Come on in, take a seat! We got your favorite beanbag chair nice and warm. You want some chips? Marin Kharin-flavored okay with you?"
 PC_FRIENDLY_GREETING_02:0 "Traveling on the Road of Light with the [From.GetSpeciesNamePluralCompliment] is a truly transcendant experience. Bud, we are proof that peace works! I hope the [Root.GetAllianceName] never breaks up!"
 PC_FRIENDLY_GREETING_03:0 "Gotta warn you, dude, I'm a hugger. Do you wanna hug? Cool if you don't, but all you gotta do is ask."
 PC_FRIENDLY_GREETING_04:0 "The [Root.GetName] hereby offers the [From.GetName] one tree, planted in the name of peace and harmony! We hope our friendship with you dudes becomes like a majestic old-growth forest."
 PC_FRIENDLY_GREETING_05:0 "I just finished making pizza! It's this really rad Earth recipe I got from the Rackets. You wanna try some? It's the galaxy's most perfect munchie cure, I swear."
 PC_FRIENDLY_GREETING_06:0 "Hey, welcome to our humble [Root.Capital.GetName]! A spot just opened up in the drum circle. You wanna join?"
 PC_FRIENDLY_GREETING_07:0 "[From.Ruler.GetName]! Come on in! Sit down, I'll break out the crystals and the dream guides, and we can do a reading together. Or do you wanna talk about something else?"
 PC_FRIENDLY_GREETING_08:0 "[From.GetSpeciesNamePlural], welcome! We have a class of [Root.GetAdj]-microdudes hanging with us today. Do you wanna give the littles a pep-talk about the power of friendship?"
 PC_FRIENDLY_GREETING_09:0 "Wow, the [From.GetSpeciesNamePlural]! It's good to see you. Sorry, gimme a sec to bask in your [From.GetSpeciesNameCompliment] awesomeness. What can we do for you, dudes?"
 PC_FRIENDLY_GREETING_10:0 "[From.GetRulerName], it's good to see you! [Root.GetRulerName] is in the community kitchen helping make dinner for tonight. I'll let 'em know you're here to see [Root.Leader.GetHerHim]."
 PC_FRIENDLY_GREETING_HUMAN_01:0 "So you're telling us that the 1960s in your world is a lot like us? Dude! That is so far beyond trippy! Tell us more about this John Lennon guy!"
 PC_FRIENDLY_GREETING_HUMAN_02:0 "Sorry again about the pizza, [From.GetSpeciesName]. I didn't know you didn't like Ubogleelt locusts. I didn't mean to insult your culture, I just wanted to make you feel at home..."
 PC_FRIENDLY_GREETING_AQUATIC_01:0 "What's the surfing like on [From.Capital.GetName]? I've heard the waves are choice, but I wanna ask a local first. It'd be totally tubular to run a sesh with you sometime!"
 PC_MECH_FRIENDLY_GREETING_01:0 "Hey, it's [From.GetRulerName]! Come on in, take a seat! We were just about to watch a movie. We got your usual power bank plugged in and powered up, so make yourself at home."
 PC_PROTECTIVE_GREETING_01:0 "I think we should be buds! We got a couch, you're always welcome to crash with us. It'd be like a sleepover!"
## Protest Chants
 PC_WAR_GREETING_01:0 "No Justice, No Peace! No [From.Capital.GetName] rule on [Root.Capital.GetName] streets!"
 PC_WAR_GREETING_02:0 "[From.GetAdj], [From.GetAdj], What do you say? How many schools did you bomb today? [From.GetRulerName], [From.GetRulerName], What do you say? How many [Root.GetSpeciesSpawnNamePlural] did you kill today?"
 PC_WAR_GREETING_03:0 "Hey-Hey! Ho-Ho! The occupation's got to go! Hey-Hey! Ho-Ho! [From.GetRulerName] has got to go!"
 PC_WAR_GREETING_04:0 "Up, Up, Up with the People! Down, Down, Down with the Gestalt Evil!"
 PC_WAR_GREETING_05:0 "When [Root.GetAdj] lives are under attack, what do we do? STAND UP, FIGHT BACK! What do we do? STAND UP, FIGHT BACK!"
 PC_WAR_GREETING_06:0 "Show me what Democracy looks like! (This is what Democracy looks like!) Show me what Democracy looks like! (This is what Democracy looks like!)"
 PC_WAR_GREETING_HUMAN_01:0 "John Lennon would be so disappointed in you."
# Nuclear Gandhi Arc
 PC_HOSTILE_GREETING_PK_SHIELDER_01:0 "You should feel lucky that we don't have itchy trigger-appendages. Who knows what you would do if you had a planet-killer?"
 PC_HOSTILE_GREETING_PK_SHIELDER_02:0 "This is mutally assured destruction. You're smarter than this! There's still time to fix things. There's still time to disarm and turn things around. We'll listen to reason if you'll just sit and talk with us."
 PC_HOSTILE_GREETING_PK_SHIELDER_03:0 "We don't hate you, [From.GetSpeciesNamePlural]. We're mad, we're disappointed, and we're running out of patience for you. But there's still time, man. There's still time..."
 PC_HOSTILE_GREETING_PK_SHIELDER_04:0 "It doesn't have to be this way. We don't want this, dude. We don't want this, and neither do you. Surely, some part of your soul's gotta understand..."
 PC_HOSTILE_GREETING_PK_SHIELDER_05:0 "The future may be a foreign land, but 55 years from now, maybe you'll have forgiven me. Right here, right now, we can pray for more. We could grow old together. We could love one another. Won't you hear me out?" # Kudos to Ghost and The Future is a Foreign Land
 PC_HOSTILE_GREETING_PK_SHIELDER_06:0 "We can start negotiating with baby steps. Baby steps! Small stuff, like arms control, or a hotline to the [From.GetRulerTitle]'s office. If you reopen your embassy, maybe we'll reopen ours."
 PC_HOSTILE_GREETING_PK_SHIELDER_07:0 "Just send an envoy to improve relations. We can still figure out a way to peace. I know we can! Please!"
 PC_HOSTILE_GREETING_HUMAN_PK_SHIELDER_01:0 "Don't keep doing this. We love Earth. We've always loved Earth, just as much as we love [Root.GetHomeWorldName]. The smartest humans in your world's history came up with a Doomsday Clock, and it's ticking towards Midnight. But we still have time!"
 PC_HOSTILE_GREETING_HUMAN_PK_SHIELDER_02:0 "Think of the Cuban Missile Crisis, man! Think of the Cold War! Think of World War 3! You don't want this! You know you don't! This is insanity, dude! Insanity!"
 PC_NEUTRAL_GREETING_PK_SHIELDER_01:0 "'Sup. We still come in peace."
 PC_NEUTRAL_GREETING_PK_SHIELDER_02:0 "Hm? Oh, yeah, we always got time to talk. All the time in the world. What do you need, my dude?"
 PC_NEUTRAL_GREETING_PK_SHIELDER_03:0 "Look, about the giant thing parked over our shipyard... that's just for our own protection. I hope we never use it."
 PC_NEUTRAL_GREETING_PK_SHIELDER_04:0 "I can't sleep at night anymore. I keep having nightmares. Or are they visions? Look, between you and me, I'm scared for the future of our galaxy. We have peace for now. But what about 50 years from now? How many minutes left until Midnight?"
 PC_NEUTRAL_GREETING_PK_SHIELDER_05:0 "Hey, my brother! Do you wanna come by and visit? No? ... Is it because of the... giant thing? Hey... that's okay, it scares me too. B-But we still got movies! Please hang out with us?"
 PC_NEUTRAL_GREETING_PK_SHIELDER_06:0 "Please, forgive us. We didn't have a choice... We tried... We tried so hard..."
 PC_NEUTRAL_GREETING_PK_SHIELDER_07:0 "So, this is what disarmament is all about... It's alleviating our consciences. About making the nightmares of war end, for the good of all. But I still want peace. I still want it..."
 PC_NEUTRAL_GREETING_PK_SHIELDER_08:0 "They say that power is addicting. But even addicts hate their addictions and want to quit. Right?"
 PC_THREATENED_GREETING_01:0 "Look, dude, violence super isn't the answer. I think we should sit down and share our feelings. Without blasters. Please?"
 PC_THREATENED_GREETING_PK_SHIELDER:0 "The Global Pacifier is our last line of defense. But it's not our only weapon against you! Please, we're begging on the ground, listen to reason! We don't wanna destroy you, or anyone else!"
 PC_FRIENDLY_GREETING_PK_SHIELDER_01:0 "Are you ever just... tired? Like you can't get out of bed in the morning? Is that what having a heavy conscience feels like?"
 PC_FRIENDLY_GREETING_PK_SHIELDER_02:0 "Hey. No, I haven't felt much like playing music lately. No, dude, don't worry about it. I'm okay. Honest..."
 PC_FRIENDLY_GREETING_PK_SHIELDER_03:0 "You know, I don't think I valued our friendship enough before. I'm glad to have you with me. Really."
 PC_FRIENDLY_GREETING_PK_SHIELDER_04:0 "War comes if we want it or not. If we're ready for it or not. Public opinion is... it's like an avalanche. It starts with one dude getting way too worked up..."
 PC_FRIENDLY_GREETING_PK_SHIELDER_05:0 "Were we naive, thinking that peace was something everyone would want? Is utopia really something we can just... have? Is it worth the price?"
 PC_FRIENDLY_GREETING_PK_SHIELDER_06:0 "You know the worst part about being psychic? You can literally feel it when people are absolutely miserable. And it starts affecting you, bad."
 PC_FRIENDLY_GREETING_PK_SHIELDER_07:0 "Hm? Oh, yeah, I'm okay today. Thanks for asking, bud, I really appreciate it. Are you doing okay?"
 PC_FRIENDLY_GREETING_HUMAN_PK_SHIELDER_01:0 "Hey. Do you wanna watch Monty Python with us for our next Peace Festival? No harm if you don't wanna, but it'd be nice..."
 PC_FRIENDLY_GREETING_HM_PK_SHIELDER_09:0 "What is it like? Not feeling any remorse or empathy? There are times, I kinda envy you. No pain. No regret. Just existing, doing anything you need to survive, without having to second-guess yourself. But I'd miss feeling love... I still wanna feel loved..."
 PC_WAR_GREETING_PK_SHIELDER_01:0 "We can't stand by and watch you inflict suffering on the galaxy anymore! It's time to put you away for good!"
 PC_WAR_GREETING_PK_SHIELDER_02:0 "Do you know what 'Nuclear Gandhi' is? No? Well, you're gonna find out. Believe me, you are gonna find out, dude."
 PC_WAR_GREETING_PK_SHIELDER_03:0 "You will never--NEVER!--hurt ANYONE ever again! You'll have to learn to live with yourselves, because you're never leaving [From.Capital.GetName]! The cycle of abuse ends here and now!"
 PC_WAR_GREETING_PK_SHIELDER_04:0 "Piece of advice. When the shield goes up, turn off your factories. You're gonna want that planet to last as long as possible. Maybe try learning to live in harmony with nature and each other, and you'll be fine. And the rest of the galaxy will finally be fine too."
 PC_WAR_GREETING_PK_SHIELDER_05:0 "This is our last resort. We have tried everything else. We have tried for centuries with you. We finally ran out of patience."
 PC_WAR_GREETING_PK_SHIELDER_06:0 "Your great-great-grand[From.GetSpeciesSpawnNamePlural] will forgive us. They might even thank us."
 PC_WAR_GREETING_PK_SHIELDER_HUMAN_01:0 "Oh, god... I can't watch... I can't..."
 PC_PROTECTIVE_GREETING_PK_SHIELDER_01:0 "We swear, dude, you'll never have to be afraid of us. The galaxy's a terrifying enough place already."

# Subjugation/Vassalisation
## Demanding Vassalization
 PC_DEMAND_VASS_SELECT_1:0 "Well, the galaxy is a really dangerous place... You'd be willing to fight for us? You sure?"
 PC_DEMAND_VASS_SELECT_2:0 "Okay, I never thought I'd ask _you_ this, dude. But are you high right now?"
 PC_DEMAND_VASS_PROPOSE:0 "Look, dude, I swear we're cool. But we're worried about you, and we don't want you to get curb-stomped by some nutso fanatic purifier. Yea or nay, you've always got a couch to crash on at our place. Just say the word."
 PC_DEMAND_VASS_ACCEPT_1:0 "We accept your protection! You are hereby The Rainbow Warriors of the [Root.GetName]! We've made a spot on the [Ruler.GetTitle]'s personal couch for you!"
 PC_DEMAND_VASS_ACCEPT_2:0 "We spent thousands of years protecting the wilderness on our planets. Who knew that Mother Nature herself would be returning the favor? We accept!"
 PC_DEMAND_VASS_ACCEPT_3:0 "All our lives, we admired you. The first time we got radio broadcasts from [From.GetHomeWorldName], we were just starting to reach out into the cosmos. We were hoping we would find friends. It was magical, dude. We understood what you had to say, we _connected_. We really took what your world's heroes said to heart.\n\nThe [From.GetSpeciesNamePlural] are, well, kind of like the big brother we'd always heard about and hoped we'd meet. We might have only met kinda recently, but the [Root.GetSpeciesNamePlural] have idolized you for centuries. We accept. Can, uh... can I give you a hug?"
 PC_DEMAND_VASS_REFUSE_1:0 "We brought it up at the drum circle, and put it to a vote. It was a pretty close margin, but we respect all the voices in our community. Sorry, dude."
 PC_DEMAND_VASS_REFUSE_2:0 "Oh, I'm gonna need a joint for this. No. Not just no, but you can go stick it where light can't escape. Let you in on a secret, we've spent years getting ready for this. Go ahead. Try it. We'll be the most annoying headache of a siege you've ever had to deal with in your civilization's entire history."
## Asking for Vassalization
 PC_ASK_FOR_VASS_SELECT:0 "Hold up. You want us... to fight for you? You sure you're asking the right dudes, dude?"
 PC_ASK_FOR_VASS_PROPOSE:0 "We have the world's scariest neighbors, and we think they're gonna eat us! The vibe has been irreparably harshed, and we really need a scary dude standing right behind us to make them back off. We figure, 'Hey, you're scary, and you won't eat us!' Please?"
 PC_ASK_FOR_VASS_ACCEPT:0 "Look, we don't believe in things like 'domination' and 'overlord-ing'. So, if it really helps, just think of yourselves as our roommates! As long as you do the dishes, you can crash here as long as you want. We hate doing the dishes..."
 PC_ASK_FOR_VASS_REFUSE:0 "Search your heart and listen to your feelings! True freedom is right around the corner, and your destiny should be your own! You don't need us to fight for you. We believe in you, bud!"
## Subsidiaries
 PC_DEMAND_SUBS_SELECT_1:0 "What? Like a union contract? I know what those are, I think."
 PC_DEMAND_SUBS_ACCEPT_1:0 "I mean, if workers gotta work together, then I guess it makes sense that we stick with the union. Do I get a hat and a badge? And can we use the breakroom couch?"
 PC_DEMAND_SUBS_REFUSE_1:0 "Look, we appreciate the offer, but we're self-employed and self-sufficient, and pretty happy that way. No thanks, dudes."
 PC_DEMAND_SUBS_SELECT_2:0 "Could you say that again in not-Corporatese? Because that sounds like you wanna make us your little pet puppet."
 PC_DEMAND_SUBS_ACCEPT_2:0 "... wait, what did I just sign?"
 PC_DEMAND_SUBS_REFUSE_2:0 "You can take your fancy jargon and ball pits and jets and rich-guy bullshit, and go park it in a pulsar! We'll never sell out! Never!" PC_ASK_FOR_SUBS_PROPOSE_1:0 "So, we wanted to ask, just out of curiousity, what are the requirements to join a union?"
 PC_ASK_FOR_SUBS_PROPOSE_2:0 "The [Root.GetName]'s hailing service seems to have gone haywire. They usually use this line to send insults and prank calls. But it appears that they've accidentally filed a request for subsidiariazation./n/nPerhaps this is another elaborate prank? Or quite possibly, a bug you should report to SageWilde on Steam in the comments section of this mod, given that they put a great deal of effort into making sure that Hippies and Capitalists are mortal enemies."
## Tributaries
 PC_DEMAND_TRIBUTARY_SELECT:0 "Money? You want money? What are you gonna do, ambush me at home? Give me swirlies in my own toilet? Piss on my rug?"
 PC_DEMAND_TRIBUTARY_ACCEPT:0 "... I liked that rug. It really tied the room together."
 PC_DEMAND_TRIBUTARY_REFUSE:0 "You should probably lay off the old Earth movies."
 PC_ASK_BECOME_TRIBUTARY_PROPOSE:0 "Look, we've seen enough old Earth movies to know how our general situation tends to go. Why don't we just get it over and done with in advance? Here's your money. Now that you have it, please don't kill us."
## Releasing Subjects
 PC_RELEASE_SUBJECT_SELECT:0 "Huh? Wait, you're kicking us off your couch? But we do the dishes! And our neighbors still wanna eat us!"
 PC_RELEASE_SUBJECT_PROPOSE:0 "It's time you spread your wings and left the nest, young padawan!"
 PC_RELEASE_SUBJECT_ACCEPT:0 "Aww... major bummer. Well... can we at least still hang out?"
 PC_ASK_TO_BE_RELEASED_SUBJECT_SELECT:0 "You sure? The galaxy's a wretched hive of scum and villainy, and we said you can stay on our couch for as long as you need to..."
 PC_ASK_TO_BE_RELEASED_SUBJECT_PROPOSE:0 "We've been staying on your couch for too long, dude. We don't wanna be bad guests, and we think we need a place of our own. No harsh vibes, though, we're still grateful."
 PC_ASK_TO_BE_RELEASED_SUBJECT_ACCEPT:0 "Bummer. But you know what? We're still good. And you can always come hang with us again. Enjoy your freedom, [From.GetSpeciesName] dudes!"
 PC_ASK_TO_BE_RELEASED_SUBJECT_REFUSE:0 "Dudes, I dunno if you know this, but your aura super does not look good. If we let you go now, you might get hurt. Just stay with us a little longer, until you can make it alone. Okay?" 
## Hippie Roommate / Vassal
 PC_VASSAL_GREETING_01:0 "Hey, dude. Yep, your spot on the couch is still yours. By the way, thanks for being there for us."
 PC_VASSAL_GREETING_02:0 "Hey, dinner at your place this week, or ours? I kinda wanna try [From.GetAdj] food again."
 PC_VASSAL_GREETING_03:0 "Could I borrow your shuttle for a quick trip to the herb shop? The Love Machine's in the hangar getting its engine fixed."
 PC_VASSAL_GREETING_03_BIO:0 "Could I borrow your shuttle for a quick trip to the herb shop? The Love Bug's down with a case of the sniffles."
 PC_VASSAL_GREETING_04:0 "We're one with nature! What does nature need from us today?"
 PC_VASSAL_GREETING_O5:0 "Greetings from [Root.Capital.GetName], Earthling-bros! Could I borrow your library card again? I wanna return my Beatles Anthology and get more Bob Marley."
 PC_VASSAL_GREETING_DISLOYAL_01:0 "Sorry, [From.GetRulerName]. Your spot on the couch isn't here anymore. You're gonna have to sit on the floor."
 PC_VASSAL_GREETING_DISLOYAL_02:0 "No way! I've done the dishes three weeks in a row! It is your turn, dude! I'm not gonna do it this time!"
 PC_VASSAL_GREETING_DISLOYAL_03:0 "Dude, could I borrow your shuttle for a-- you know what, never mind. Yours is an awful fuel-hog anyway."
 PC_VASSAL_GREETING_DISLOYAL_03_BIO:0 "Dude, could I borrow your shuttle for a-- you know what, never mind. Yours eats like a Behemoth anyway."
 PC_VASSAL_GREETING_DISLOYAL_04:0 "They say that Mother Nature is a bitch. Turns out, she ain't one. She's several."
 PC_VASSAL_GREETING_DISLOYAL_05:0 "We're going to keep sticking it to the Man! Even if we have to pay you rent, we'll pay it in wheelbarrows of greasy pennies!"
## Hippie Landlord / Overlord
 PC_OVERLORD_GREETING_01:0 "You sure do have a comfy couch!"
 PC_OVERLORD_GREETING_02:0 "Hey, bud! Got something on your mind? We're always here to listen."
 PC_OVERLORD_GREETING_03:0 "Thanks for inviting us to the [From.Capital.GetName] Holocinema Festival next month. You guys have awesome movies!"
 PC_OVERLORD_GREETING_04:0 "Hey, friendly reminder; when you borrow my shuttle, please put the keys back on the hook. Thanks, dude."
 PC_OVERLORD_GREETING_05:0 "We are stewards of our environment! What does the environment need today?"

# Insults
## Empires About To Insult Hippies
 PC_PREINSULT_HIPPIE_01:0 "Huh?"
 PC_PREINSULT_HIPPIE_02:0 "Look, just take a deep cleansing breath before you--!"
 PC_PREINSULT_HIPPIE_03:0 "Oh, yeah, that's right, you think you're funny."
 PC_PREINSULT_HIPPIE_PK_SHIELDER:0 "..."
## Empires insulting hippies
 PC_INSULT_HIPPIE_01:0 "Take a Shroud-damned bath, you filthy hippie [Root.GetSpeciesNameInsult]!"
 PC_INSULT_HIPPIE_02:0 "Get a real job already, you lousy [Root.GetAdj] bum! The galaxy has no room for crusty, freeloading, tone-deaf losers like you."
 PC_INSULT_HIPPIE_03:0 "This is what free love and loose morals gets you. Reefer madness!"
 PC_INSULT_HIPPIE_04:0 "Will you cover up that unsightly insult already? This isn't a nudist resort world, this is a diplomatic forum! Act like a sapient xeno, or we'll be forced to put you in a zoo with the other animals!"
 PC_INSULT_HIPPIE_05:0 "I don't know how to put this delicately... but was that a flea I saw crawling through your fur?!"
